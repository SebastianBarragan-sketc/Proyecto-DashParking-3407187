<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Dash Parking</title>
</head>
<body>
    <main>
    <section class="inicio">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1>Gestiona tu parqueadero de forma inteligente</h1>
                    <p>
                        Consulta espacios disponibles,
                        realiza pagos digitales y
                        obtén tu código QR de salida.
                    </p>
                    <a href="login.html" class="btn btn-light btn-lg"> Comenzar </a>
                </div>
                <div class="col-lg-6 text-center">
                    <img src="imagenes/Logo.png" class="img-fluid logo">
                </div>
            </div>
        </div>
    </section>
    <section class="servicios container py-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h4>Cupos en tiempo real</h4>
                        <p>Consulta espacios disponibles.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h4>Pago Digital</h4>
                        <p>Paga desde tu celular.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h4>Código QR</h4>
                        <p>Salida rápida y segura.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
<footer class="pie"> <p> Dash Parking © 2026 </p> </footer>

</html>
