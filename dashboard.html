<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header class="encabezado">
        <div class="container">
            <h2>Dash Parking</h2>
        </div>
    </header>
    <main class="contenido">
        <section class="tarjetas">
            <div class="container">
                <div class="row">
                    <div class="col-md-4">
                        <div class="tarjeta">
                            <h3>120</h3>
                            <p>Cupos Disponibles</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="tarjeta">
                            <h3>80</h3>
                            <p>Cupos Ocupados</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="tarjeta">
                            <h3>200</h3>
                            <p>Capacidad Total</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="acciones">
            <div class="container text-center">
                <a href="#" class="btn btn-info m-2"> Realizar Pago </a>

                <a href="#" class="btn btn-primary m-2">Generar codigo QR </a>
            </div>
        </section>
        <section class="movimientos">
            <div class="container">
                <h3>Movimientos Recientes</h3>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>ABC123</td>
                            <td>Ingreso</td>
                        </tr>
                        <tr>
                            <td>XYZ456</td>
                            <td>Salida</td>
                        </tr>
                        <tr>
                            <td>JKL789</td>
                            <td>Ingreso</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
