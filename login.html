<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
    <title>Dash Parking</title>
</head>
<body>
    <main class="fondo">
        <div class="login">
            <img src="imagenes/logo.png" alt="Logo Dash Parking" class="logo">
            <h2>Iniciar Sesión</h2>
            <form>
                <div class="campo">
                    <label>Usuario</label>
                    <input type="text" class="form-control" placeholder="Ingrese su usuario">
                </div>
                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" class="form-control" placeholder="Ingrese su contraseña">
                </div>
                <a href="dashboard.html" class="btn btn-primary boton"> Ingresar </a>
                <a href="registrarse.html" class="btn btn-outline-primary boton-registro"> Registrarse </a>
            </form>
        </div>
    </main>
</body>

</html>
